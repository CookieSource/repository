name        : hyprgraphics
version     : "0.5.0"
release     : 1
homepage    : https://github.com/hyprwm/hyprgraphics
upstreams   :
    - https://github.com/hyprwm/hyprgraphics/archive/v0.5.0/hyprgraphics-0.5.0.tar.gz : bb37f611c1f50e58dcc0aa97ec1b39c186b78160807f109c5dd8833d58f8bc04
summary     : Hyprland graphics resources and utilities
description : |
    Hyprland graphics resources and utilities.
license     : BSD-3-Clause
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(hyprutils)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(libjxl_threads)
    - pkgconfig(libmagic)
    - pkgconfig(libpng)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libwebp)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
setup       : |
    %cmake \
        -DCMAKE_BUILD_TYPE=Release
build       : |
    %cmake_build
install     : |
    %cmake_install
