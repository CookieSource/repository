name        : hyprland
version     : "0.54.0"
release     : 1
homepage    : https://github.com/hyprwm/Hyprland
upstreams   :
    - https://github.com/hyprwm/Hyprland/releases/download/v0.54.0/source-v0.54.0.tar.gz : ddc4f7f1dd2d29ebfeaf462fe361593034f104de85b80e3e81f73e33602a69ae
summary     : Highly customizable dynamic tiling Wayland compositor
description : |
    Highly customizable dynamic tiling Wayland compositor.
license     : BSD-3-Clause
builddeps   :
    - binary(cmake)
    - cmake(glaze)
    - cmake(hyprwayland-scanner)
    - pkgconfig(aquamarine)
    - pkgconfig(cairo)
    - pkgconfig(egl)
    - pkgconfig(gbm)
    - pkgconfig(gio-2.0)
    - pkgconfig(gl)
    - pkgconfig(hyprcursor)
    - pkgconfig(hyprgraphics)
    - pkgconfig(hyprland-protocols)
    - pkgconfig(hyprlang)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwire)
    - pkgconfig(libdrm)
    - pkgconfig(libinput)
    - pkgconfig(muparser)
    - pkgconfig(pango)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
    - pkgconfig(re2)
    - pkgconfig(tomlplusplus)
    - pkgconfig(uuid)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - pkgconfig(xcb)
    - pkgconfig(xcb-composite)
    - pkgconfig(xcb-errors)
    - pkgconfig(xcb-icccm)
    - pkgconfig(xcb-render)
    - pkgconfig(xcb-res)
    - pkgconfig(xcb-xfixes)
    - pkgconfig(xcursor)
    - pkgconfig(xkbcommon)
    - name(glaze-devel)
rundeps     :
    - binary(Xwayland)
    - hyprland-guiutils
setup       : |
    sed -i -e '/^release:/{n;s/-D/-DCMAKE_SKIP_RPATH=ON -D/}' Makefile
build       : |
    %make release PREFIX=%(prefix)
install     : |
    %make_install PREFIX=%(prefix)
    rm -f %(installroot)%(includedir)/hyprland/src/version.h.in
