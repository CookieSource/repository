name        : hyprland-guiutils
version     : "0.2.1"
release     : 1
homepage    : https://github.com/hyprwm/hyprland-guiutils
upstreams   :
    - https://github.com/hyprwm/hyprland-guiutils/archive/v0.2.1/hyprland-guiutils-0.2.1.tar.gz : 8de6ab7295dd120bab6b6b3e884b27b3c6ccc38ae345f3144bf9b5ad79251bcb
summary     : Hyprland GUI utilities
description : |
    Hyprland GUI utilities.
license     : BSD-3-Clause
builddeps   :
    - pkgconfig(aquamarine)
    - pkgconfig(cairo)
    - pkgconfig(egl)
    - pkgconfig(gbm)
    - pkgconfig(gl)
    - pkgconfig(hyprgraphics)
    - pkgconfig(hyprlang)
    - pkgconfig(hyprtoolkit)
    - pkgconfig(hyprutils)
    - pkgconfig(iniparser)
    - pkgconfig(libdrm)
    - pkgconfig(pango)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
setup       : |
    %cmake \
        -DCMAKE_BUILD_TYPE=Release
build       : |
    %cmake_build
install     : |
    %cmake_install
